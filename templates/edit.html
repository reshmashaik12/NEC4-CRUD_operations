<!DOCTYPE html>
<html>

<head>
    <title>Edit Person</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>CRUD</h1>
        <h2>Edit Person</h2>

        <form method="POST">

            <input type="text" name="name" value="{{ person.name }}" required>

            <input type="number" name="age" value="{{ person.age }}" required>

            <input type="text" name="city" value="{{ person.city }}" required>

            <button type="submit">
            Update
        </button>

        </form>

    </div>

</body>

</html>
