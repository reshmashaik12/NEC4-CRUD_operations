<!DOCTYPE html>
<html>
<head>
    <title>Add Person</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">

    <h1>CRUD</h1>
    <h2>Add Person</h2>

    <form method="POST">

        <input type="text"
               name="name"
               placeholder="Enter Name"
               required>

        <input type="number"
               name="age"
               placeholder="Enter Age"
               required>

        <input type="text"
               name="city"
               placeholder="Enter City"
               required>

        <button type="submit">
            Save
        </button>

    </form>

</div>

</body>
</html>
